<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web of Us — The Amazing TylaSpida #1</title>
<meta name="description" content="The Amazing TylaSpida #1 — starring Tyla &amp; Christina">
<meta name="theme-color" content="#0b1026">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕷️</text></svg>">
<meta property="og:type" content="website">
<meta property="og:title" content="Web of Us">
<meta property="og:description" content="The Amazing TylaSpida #1 — starring Tyla &amp; Christina">
<meta property="og:image" content="https://tylaspida.github.io/web-of-us/images/cover_wide.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tylaspida.github.io/web-of-us/images/cover_wide.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="images/cover_wide.jpg">
<style>
  :root{
    --navy:#0b1026; --navy2:#141a3d; --navy3:#1e2656;
    --pink:#ff3d9a; --pink2:#ff7ac0; --red:#ff2e3f; --ink:#f4f1ff; --muted:#aab0d6;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--navy);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .bangers{font-family:Bangers,Impact,sans-serif;letter-spacing:.04em;font-weight:400}

  /* ---------- Title screen ---------- */
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:24px 22px calc(40px + var(--safe-b));text-align:center;z-index:5;overflow:hidden;
    transition:opacity .45s ease, transform .45s ease}
  #title.hide{opacity:0;transform:scale(1.04);pointer-events:none}
  #title .bg{position:absolute;inset:0;background:url(images/cover_wide.jpg) center 30%/cover no-repeat;filter:saturate(1.1);
    animation:drift 18s ease-in-out infinite alternate}
  #title .shade{position:absolute;inset:0;background:
      radial-gradient(120% 60% at 50% 0%, transparent 0%, rgba(11,16,38,.25) 55%, transparent 100%),
      linear-gradient(180deg, rgba(11,16,38,.15) 0%, rgba(11,16,38,.35) 38%, rgba(11,16,38,.92) 66%, var(--navy) 100%)}
  #title .web{position:absolute;inset:0;opacity:.18;pointer-events:none;
    background:
      repeating-radial-gradient(circle at 100% 0%, transparent 0 34px, rgba(255,255,255,.7) 35px, transparent 36px),
      repeating-conic-gradient(from 180deg at 100% 0%, transparent 0 8deg, rgba(255,255,255,.6) 8deg 8.4deg);
    -webkit-mask:radial-gradient(circle at 100% 0%, #000 0 30%, transparent 55%);mask:radial-gradient(circle at 100% 0%, #000 0 30%, transparent 55%)}
  @keyframes drift{from{transform:scale(1.05) translateY(0)}to{transform:scale(1.12) translateY(-10px)}}
  .content{position:relative;max-width:520px;width:100%}
  .issue{display:inline-block;background:var(--red);color:#fff;padding:5px 12px 3px;border-radius:4px;transform:rotate(-3deg);
    font-size:18px;box-shadow:3px 3px 0 #000;margin-bottom:10px}
  h1{font-size:clamp(64px,19vw,112px);line-height:.9;color:#fff;
    text-shadow:3px 3px 0 var(--red),6px 6px 0 #000, 0 0 28px rgba(255,61,154,.55);transform:rotate(-2deg)}
  h1 .of{color:var(--pink);font-size:.62em;vertical-align:.18em;text-shadow:3px 3px 0 #000}
  .tagline{margin:14px auto 26px;max-width:340px;font-weight:800;font-size:16px;line-height:1.35;color:var(--ink);text-shadow:0 2px 8px #000}
  .tagline b{color:var(--pink2)}
  .cta{position:relative;display:inline-flex;align-items:center;gap:10px;padding:16px 34px 13px;font-size:28px;color:#fff;
    background:linear-gradient(180deg,var(--pink) 0%,#e8207c 100%);border:3px solid #000;border-radius:999px;
    box-shadow:5px 5px 0 #000,0 0 0 4px rgba(255,61,154,.25),0 10px 40px rgba(255,61,154,.5);
    transition:transform .12s ease, box-shadow .12s ease;animation:pulse 2.4s ease-in-out infinite}
  .cta:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
  .cta:hover{filter:brightness(1.08)}
  @keyframes pulse{0%,100%{box-shadow:5px 5px 0 #000,0 0 0 4px rgba(255,61,154,.25),0 10px 40px rgba(255,61,154,.45)}
                   50%{box-shadow:5px 5px 0 #000,0 0 0 10px rgba(255,61,154,.12),0 10px 50px rgba(255,61,154,.7)}}
  .hint{margin-top:18px;font-size:13px;color:var(--muted);font-weight:600}
  .hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .hearts span{position:absolute;bottom:-30px;font-size:18px;opacity:0;animation:float 9s linear infinite}
  @keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.85}100%{transform:translateY(-105vh) rotate(40deg);opacity:0}}

  /* ---------- Reader ---------- */
  #reader{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%, var(--navy3) 0%, var(--navy) 60%);
    opacity:0;pointer-events:none;transition:opacity .4s ease}
  #reader.show{opacity:1;pointer-events:auto}
  .topbar{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(8px + var(--safe-t)) 12px 8px;pointer-events:none}
  .topbar > *{pointer-events:auto}
  .tb-left,.tb-right{display:flex;gap:8px;align-items:center}
  .brand{font-size:22px;color:#fff;text-shadow:2px 2px 0 var(--red);pointer-events:none!important}
  .brand span{color:var(--pink)}
  .counter{font-size:20px;padding:4px 12px 2px;border-radius:999px;background:rgba(20,26,61,.85);border:2px solid var(--pink);
    min-width:74px;text-align:center;box-shadow:2px 2px 0 #000;white-space:nowrap}
  .iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(20,26,61,.85);
    border:2px solid rgba(255,255,255,.15);font-size:18px;line-height:1}
  .iconbtn:hover{border-color:var(--pink)}
  .iconbtn[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 12px rgba(255,61,154,.6)}
  /* stage + book */
  .stage{position:absolute;left:10px;right:10px;top:calc(58px + var(--safe-t));bottom:calc(40px + var(--safe-b))}
  #book{width:100%;height:100%}
  /* StPageFlip base styles (from its stPageFlip.css) */
  .stf__parent{position:relative;display:block;box-sizing:border-box;transform:translateZ(0);touch-action:pan-y}
  .stf__parent canvas{position:absolute;width:100%;height:100%;left:0;top:0}
  .stf__block{position:absolute;width:100%;height:100%;box-sizing:border-box;perspective:2000px}
  .stf__item{display:none;position:absolute;transform-style:preserve-3d}
  .stf__outerShadow,.stf__innerShadow,.stf__hardShadow,.stf__hardInnerShadow{position:absolute;left:0;top:0;pointer-events:none}
  .stf__wrapper{position:relative;width:100%;height:100%!important;padding:0!important}
  .page{background:#fbf6ec;overflow:hidden}
  .page .inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .page img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
  /* paper feel: gutter shading + edge sheen on every page */
  .page .inner::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(0,0,0,.16) 0%,rgba(0,0,0,0) 5%,rgba(0,0,0,0) 95%,rgba(255,255,255,.10) 100%)}
  .page.--left .inner::after{background:linear-gradient(270deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 6%,rgba(0,0,0,0) 96%,rgba(255,255,255,.1) 100%)}
  .page.cover .inner{background:var(--navy2)}
  .page.cover .inner::before{content:"";position:absolute;inset:-20px;background:url(images/01.jpg) center/cover;filter:blur(18px) brightness(.55) saturate(1.2)}
  .page.cover img{position:relative}
  /* stacked-paper edge + drop shadow behind the visible book */
  .paper{position:absolute;pointer-events:none;border-radius:2px;transition:opacity .3s;
    box-shadow:0 22px 50px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);
    background:repeating-linear-gradient(90deg,#e9e1cf 0 1px,#fbf6ec 1px 3px)}
  .paper::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 3px rgba(255,61,154,.28)}
  .curlhint{position:absolute;right:6px;bottom:6px;width:46px;height:46px;pointer-events:none;z-index:3;opacity:0;transition:opacity .4s;
    background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.25) 52%,#fff 56%,#e7dfcf 75%,#cfc5b0 100%);border-top-left-radius:6px;
    animation:peek 2.2s ease-in-out infinite}
  .curlhint.on{opacity:1}
  @keyframes peek{0%,100%{transform:scale(.75);transform-origin:100% 100%}50%{transform:scale(1);transform-origin:100% 100%}}
  .zoomhint{position:absolute;bottom:calc(46px + var(--safe-b));left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;z-index:3;
    color:var(--ink);background:rgba(11,16,38,.8);padding:4px 10px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap}
  .zoomhint.on{opacity:1}
  /* end page (inside the book) */
  .page.endpage .inner{flex-direction:column;text-align:center;gap:18px;padding:20px;
    background:radial-gradient(120% 70% at 50% 20%,var(--navy3),var(--navy) 70%);color:var(--ink)}
  .page.endpage .inner::after{display:none}
  .end h2{font-size:clamp(34px,11vw,60px);line-height:1;color:#fff;text-shadow:3px 3px 0 var(--red),5px 5px 0 #000;transform:rotate(-2deg)}
  .end h2 em{font-style:normal;display:block;color:var(--pink);font-size:.6em;text-shadow:3px 3px 0 #000}
  .end p{color:var(--muted);font-weight:700;max-width:260px;font-size:14px}
  .burst{width:min(170px,40vw);aspect-ratio:1;display:grid;place-items:center;font-size:min(66px,16vw);
    background:var(--pink);clip-path:polygon(50% 0,61% 20%,82% 8%,78% 31%,100% 35%,84% 52%,98% 70%,75% 72%,74% 95%,56% 82%,40% 100%,34% 78%,10% 88%,18% 65%,0 52%,17% 38%,6% 16%,30% 20%);
    animation:beat 1.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.07) rotate(3deg)}}
  .cta.small{font-size:22px;padding:12px 24px 9px;animation:none}
  .ghost{font-size:14px;font-weight:800;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  /* dots */
  .dots{position:absolute;left:0;right:0;bottom:calc(12px + var(--safe-b));z-index:4;display:flex;justify-content:center;gap:7px;pointer-events:none}
  .dots button{pointer-events:auto;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);padding:0;transition:all .25s ease}
  .dots button:focus{outline:none}
  .dots button:focus-visible{outline:2px solid var(--pink2);outline-offset:3px}
  .dots button.on{width:22px;border-radius:5px;background:var(--pink);box-shadow:0 0 10px var(--pink)}
  .dots button.heart{background:none;width:auto;height:auto;font-size:10px;line-height:8px;opacity:.5}
  .dots button.heart.on{opacity:1;box-shadow:none;transform:scale(1.3)}
  /* desktop tap zones (sized by JS to sit beside the book) */
  .zone{position:absolute;top:60px;bottom:40px;width:60px;z-index:3;display:none;align-items:center;cursor:pointer}
  .zone.prev{left:0;justify-content:center}
  .zone.next{right:0;justify-content:center}
  .zone span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:rgba(20,26,61,.8);
    border:2px solid var(--pink);box-shadow:3px 3px 0 #000;opacity:.55;transition:opacity .2s, transform .2s}
  .zone:hover span{opacity:1;transform:scale(1.06)}
  .zone.disabled{visibility:hidden}
  @media (hover:hover) and (pointer:fine){ .zone{display:flex} }

  /* ---------- Zoom view ---------- */
  #zoom{position:fixed;inset:0;z-index:10;background:rgba(6,9,24,.97);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    opacity:0;pointer-events:none;transition:opacity .25s ease;overscroll-behavior:contain}
  #zoom.show{opacity:1;pointer-events:auto}
  #zoom img{display:block;width:100%;max-width:760px;height:auto;margin:0 auto;padding:calc(60px + var(--safe-t)) 0 calc(80px + var(--safe-b))}
  .zoombar{position:fixed;top:0;left:0;right:0;z-index:11;display:flex;justify-content:space-between;align-items:center;
    padding:calc(8px + var(--safe-t)) 12px 8px;background:linear-gradient(180deg,rgba(6,9,24,.95),rgba(6,9,24,0));
    opacity:0;pointer-events:none;transition:opacity .25s}
  #zoom.show + .zoombar{opacity:1;pointer-events:auto}
  .zoombar .label{font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--red)}
  .closebtn{padding:8px 16px 5px;border-radius:999px;background:var(--pink);border:2px solid #000;box-shadow:3px 3px 0 #000;font-size:18px;color:#fff}
  @media (prefers-reduced-motion:reduce){#title .bg,.cta,.burst,.hearts span,.curlhint{animation:none!important}}
</style>
</head>
<body>

<!-- Title screen -->
<section id="title" aria-label="Title screen">
  <div class="bg" role="img" aria-label="Cover art: The Amazing TylaSpida"></div>
  <div class="shade"></div>
  <div class="web"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <div class="content">
    <div class="issue bangers">Issue #1</div>
    <h1 class="bangers">Web <span class="of">of</span> Us</h1>
    <p class="tagline">The Amazing TylaSpida #1 — starring <b>Tyla</b> &amp; <b>Christina</b></p>
    <button class="cta bangers" id="start">Start reading <span aria-hidden="true">🕸️</span></button>
    <p class="hint">Swipe to turn pages · tap a page to zoom in</p>
  </div>
</section>

<!-- Reader -->
<section id="reader" aria-label="Comic reader" aria-hidden="true">
  <div class="topbar">
    <div class="tb-left">
      <button class="iconbtn" id="home" aria-label="Back to title">⌂</button>
      <button class="iconbtn" id="sound" aria-label="Page-turn sound" aria-pressed="false" title="Page-turn sound">🔇</button>
    </div>
    <div class="brand bangers">Web <span>of</span> Us</div>
    <div class="counter bangers" id="counter" aria-live="polite">1 / 10</div>
  </div>
  <div class="stage" id="stage">
    <div class="paper" id="paper"></div>
    <div id="book"></div>
    <div class="curlhint" id="curlhint"></div>
  </div>
  <div class="zoomhint" id="zoomhint">Drag the corner to turn · tap to zoom 🔍</div>
  <div class="zone prev" id="zprev" aria-label="Previous page"><span>‹</span></div>
  <div class="zone next" id="znext" aria-label="Next page"><span>›</span></div>
  <nav class="dots" id="dots" aria-label="Pages"></nav>
</section>

<!-- Zoom view -->
<div id="zoom" role="dialog" aria-modal="true" aria-label="Zoomed page"><img id="zoomimg" alt=""></div>
<div class="zoombar">
  <div class="label bangers" id="zoomlabel">Page</div>
  <button class="closebtn bangers" id="zclose">Close ✕</button>
</div>

<!-- StPageFlip v2.0.7 (MIT) — local copy, see lib/page-flip.LICENSE.txt -->
<script src="lib/page-flip.browser.js"></script>
<script>
(() => {
  const PAGES = [
    {src:'images/01.jpg', label:'Cover'},
    {src:'images/02.jpg', label:'Page 1'},
    {src:'images/03.jpg', label:'Page 2'},
    {src:'images/04.jpg', label:'Page 3'},
    {src:'images/05.jpg', label:'Page 4'},
    {src:'images/06.jpg', label:'Page 5'},
    {src:'images/07.jpg', label:'Page 6'},
    {src:'images/08.jpg', label:'Page 7'},
    {src:'images/09.jpg', label:'Page 8'},
    {src:'images/10.jpg', label:'P.S.'},
  ];
  const N = PAGES.length, TOTAL = N + 1; // + end page
  const $ = id => document.getElementById(id);
  const title=$('title'), reader=$('reader'), book=$('book'), stage=$('stage'), paper=$('paper'), dots=$('dots'), counter=$('counter');
  const zoom=$('zoom'), zoomimg=$('zoomimg'), zoomlabel=$('zoomlabel'), curlhint=$('curlhint'), zoomhint=$('zoomhint');
  let idx = 0, hinted = false;

  // floating hearts on title
  const hearts=$('hearts'), glyphs=['❤️','💗','🕷️','💖'];
  for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=glyphs[i%glyphs.length];
    s.style.left=(Math.random()*100)+'%';s.style.animationDelay=(Math.random()*9)+'s';s.style.fontSize=(12+Math.random()*14)+'px';hearts.appendChild(s);}

  // ---- build pages ----
  const els = PAGES.map((p,i)=>{
    const d=document.createElement('div'); d.className='page'+(i===0?' cover':''); d.dataset.i=i;
    d.innerHTML=`<div class="inner"><img src="${p.src}" alt="${p.label} of Web of Us" decoding="async" ${i>2?'fetchpriority="low"':''}></div>`;
    return d;
  });
  const endEl=document.createElement('div'); endEl.className='page endpage end'; endEl.dataset.i=N;
  endEl.innerHTML=`<div class="inner"><div class="burst" aria-hidden="true">❤️</div>
    <h2 class="bangers">The End…<em>for now ❤️</em></h2>
    <p>Thanks for reading Web of Us, starring Tyla &amp; Christina.</p>
    <button class="cta small bangers" id="again">Read again ↺</button>
    <button class="ghost" id="totitle">Back to title</button></div>`;
  els.push(endEl);
  els.forEach(e=>book.appendChild(e));

  const pf = new St.PageFlip(book, {
    width:640, height:1440, size:'stretch',
    minWidth:300, maxWidth:1000, minHeight:200, maxHeight:2000,
    autoSize:false, usePortrait:true, showCover:true,
    drawShadow:true, maxShadowOpacity:0.75, flippingTime:750,
    mobileScrollSupport:false, swipeDistance:30, disableFlipByClick:true, clickEventForward:true,
    // finish the turn once the corner passes ~the middle of the page (or on a quick flick), otherwise snap back
    // (pos.x is the dragged corner in page space: forward turns run +pageWidth -> -pageWidth, back turns run -pageWidth -> +pageWidth)
    releaseThreshold:(rect,pos,calc)=>{
      const back = calc && calc.getDirection()===1, frac = pf.getOrientation()==='portrait' ? 0.5 : 0.2;
      const flicked = flick===(back ? 1 : -1);
      return back ? (flicked ? -0.1 : -frac)*rect.pageWidth : (flicked ? 0.9 : frac)*rect.pageWidth;
    }
  });
  pf.loadFromHTML(els);
  // showCover makes the cover a stiff "hard" page; comic covers are paper, so let it curl like the rest
  pf.getPage(0).setDensity('soft'); els[0].classList.replace('--hard','--soft');

  for(let i=0;i<TOTAL;i++){
    const b=document.createElement('button');
    if(i===N){b.className='heart';b.textContent='❤';b.setAttribute('aria-label','The End');}
    else b.setAttribute('aria-label',PAGES[i].label);
    b.addEventListener('click',()=>go(i));
    dots.appendChild(b);
  }

  const landscape = () => pf.getOrientation()==='landscape';
  // pages visible right now (1 in portrait, up to 2 in a spread)
  function visible(){
    const i=pf.getCurrentPageIndex();
    if(!landscape() || i===0) return [i];
    return [i, i+1].filter(k=>k<TOTAL);
  }
  function refresh(){
    idx=pf.getCurrentPageIndex();
    const v=visible(), pages=v.filter(k=>k<N);
    counter.textContent = pages.length===0 ? '❤' : pages.length===2 ? `${pages[0]+1}–${pages[1]+1} / ${N}` : `${pages[0]+1} / ${N}`;
    [...dots.children].forEach((d,k)=>d.classList.toggle('on',v.includes(k)));
    $('zprev').classList.toggle('disabled',idx===0);
    $('znext').classList.toggle('disabled',v[v.length-1]>=TOTAL-1);
    // mark left/right pages for gutter shading
    els.forEach((e,k)=>e.classList.toggle('--left', landscape() && k>0 && k%2===1));
    history.replaceState(null,'', idx ? '#p'+(idx+1) : '#read');
    layoutChrome();
  }
  // paper edge / shadow + desktop tap zones follow the book rectangle
  function layoutChrome(){
    const r=pf.getBoundsRect(); if(!r) return;
    const single=!landscape() || idx===0 || idx>=TOTAL-1;
    let left=r.left, w=r.width;
    if(!landscape()){ left=r.left+r.pageWidth; w=r.pageWidth; }
    else if(idx===0){ left=r.left+r.pageWidth; w=r.pageWidth; }
    Object.assign(paper.style,{left:left+'px',top:r.top+'px',width:w+'px',height:r.height+'px'});
    Object.assign(curlhint.style,{left:(left+w-46)+'px',top:(r.top+r.height-46)+'px',right:'auto',bottom:'auto'});
    const side=Math.max(56, stage.offsetLeft+left-8);
    $('zprev').style.width=side+'px'; $('znext').style.width=Math.max(56, reader.clientWidth-(stage.offsetLeft+left+w)-8)+'px';
  }

  function go(i){
    i=Math.max(0,Math.min(TOTAL-1,i));
    if(i===pf.getCurrentPageIndex() || visible().includes(i)) return;
    programmatic(()=>pf.flip(i));
  }
  // programmatic turns bypass the corner-click guard (disableFlipByClick only guards real clicks)
  const programmatic=fn=>{ const st=pf.getSettings(), d=st.disableFlipByClick; st.disableFlipByClick=false; try{fn();}finally{st.disableFlipByClick=d;} };
  const next=()=>programmatic(()=>pf.flipNext('bottom')), prev=()=>programmatic(()=>pf.flipPrev('bottom'));

  // ---- soft page-turn sound (synthesised with Web Audio, no asset) ----
  let soundOn = localStorage.getItem('wou-sound')==='1', actx=null;
  const sbtn=$('sound');
  function paintSound(){ sbtn.textContent=soundOn?'🔊':'🔇'; sbtn.setAttribute('aria-pressed',soundOn); }
  paintSound();
  sbtn.addEventListener('click',()=>{ soundOn=!soundOn; localStorage.setItem('wou-sound',soundOn?'1':'0'); paintSound(); if(soundOn) swish(0.6); });
  function swish(vol=1){
    if(!soundOn) return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
      const t=actx.currentTime, dur=0.42, len=Math.floor(actx.sampleRate*dur);
      const buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
      let last=0; for(let k=0;k<len;k++){ last=(last+0.06*(Math.random()*2-1))/1.06; d[k]=last*3.2; } // brown-ish noise = papery
      const src=actx.createBufferSource(); src.buffer=buf;
      const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.8;
      bp.frequency.setValueAtTime(700,t); bp.frequency.exponentialRampToValueAtTime(3200,t+dur*0.55); bp.frequency.exponentialRampToValueAtTime(1200,t+dur);
      const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35*vol,t+0.06); g.gain.exponentialRampToValueAtTime(0.18*vol,t+0.25); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      src.connect(bp).connect(g).connect(actx.destination); src.start(t); src.stop(t+dur);
    }catch(e){}
  }

  // ---- flip events ----
  let flipStarted=false;
  pf.on('flip', ()=>{ refresh(); if(!hinted){hinted=true;curlhint.classList.remove('on');zoomhint.classList.remove('on');} });
  pf.on('changeOrientation', ()=>setTimeout(refresh,0));
  pf.on('changeState', e=>{
    if(e.data==='user_fold'||e.data==='flipping') flipStarted=true;
    if(e.data==='flipping') swish(1);
  });
  addEventListener('resize',()=>setTimeout(layoutChrome,60));

  // ---- flick detection (horizontal speed at release) ----
  let flick=0, trail=[];
  const track=(x)=>{const t=performance.now(); trail.push({x,t}); while(trail.length>2&&t-trail[0].t>120) trail.shift();};
  book.addEventListener('pointerdown',e=>{trail=[];flick=0;track(e.clientX);},true);
  addEventListener('pointermove',e=>{ if(trail.length) track(e.clientX); },{passive:true});
  addEventListener('pointerup',e=>{ if(!trail.length) return; track(e.clientX);
    const a=trail[0], z=trail[trail.length-1], v=(z.x-a.x)/Math.max(1,z.t-a.t);
    flick=Math.abs(v)>0.45 ? Math.sign(v) : 0; trail=[]; setTimeout(()=>flick=0,50); },true);

  // ---- tap to zoom (a quick tap that did not start a fold/flip) ----
  let down=null;
  book.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,t:Date.now()}; flipStarted=false; },true);
  book.addEventListener('pointerup',e=>{
    if(!down) return;
    const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y), dt=Date.now()-down.t; down=null;
    if(moved>10 || dt>400 || e.target.closest('button')) return;
    const pageEl=e.target.closest('.page'); if(!pageEl) return;
    const i=+pageEl.dataset.i;
    setTimeout(()=>{ if(!flipStarted && pf.getState()==='read' && i<N) openZoom(i); },90);
  },true);

  function openReader(start=0){
    title.classList.add('hide'); reader.classList.add('show'); reader.setAttribute('aria-hidden','false');
    requestAnimationFrame(()=>{ pf.update(); if(start) pf.turnToPage(start); refresh();
      if(!hinted){curlhint.classList.add('on');zoomhint.classList.add('on');} });
  }
  function toTitle(){
    closeZoom(); reader.classList.remove('show'); reader.setAttribute('aria-hidden','true'); title.classList.remove('hide');
    history.replaceState(null,'',location.pathname);
  }
  function openZoom(i){
    zoomimg.src=PAGES[i].src; zoomimg.alt=PAGES[i].label+' (zoomed)'; zoomlabel.textContent=PAGES[i].label;
    zoom.scrollTop=0; zoom.classList.add('show');
  }
  function closeZoom(){ zoom.classList.remove('show'); }

  $('start').addEventListener('click',()=>openReader(0));
  $('home').addEventListener('click',toTitle);
  $('again').addEventListener('click',()=>{ pf.turnToPage(0); refresh(); swish(0.8); });
  $('totitle').addEventListener('click',()=>{ toTitle(); setTimeout(()=>{pf.turnToPage(0);refresh();},450); });
  $('zprev').addEventListener('click',prev);
  $('znext').addEventListener('click',next);
  $('zclose').addEventListener('click',closeZoom);
  zoomimg.addEventListener('click',closeZoom);

  addEventListener('keydown',e=>{
    if(!reader.classList.contains('show')){ if(e.key==='Enter'||e.key===' '){ if(document.activeElement===document.body){e.preventDefault();openReader(0);} } return; }
    if(zoom.classList.contains('show')){ if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();closeZoom();} return; }
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
    else if(e.key==='Home'){e.preventDefault();pf.turnToPage(0);refresh();}
    else if(e.key==='End'){e.preventDefault();pf.turnToPage(TOTAL-1);refresh();}
    else if(e.key==='Enter'||e.key==='z'){ const v=visible().filter(k=>k<N); if(v.length){e.preventDefault();openZoom(v[0]);} }
    else if(e.key==='Escape'){toTitle();}
  });

  // expose for testing / debugging
  window.webOfUs={pf,go,next,prev};

  // deep link: #p3 opens reader on page index 2
  const m=location.hash.match(/^#p(\d+)$/);
  if(m) openReader(Math.min(TOTAL,+m[1])-1); else if(location.hash==='#read') openReader(0);
})();
</script>
</body>
