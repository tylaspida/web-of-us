<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web of Us — The Amazing TylaSpida #1</title>
<meta name="description" content="The Amazing TylaSpida #1 — starring Tyla &amp; Christina">
<meta name="theme-color" content="#0b1026">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕷️</text></svg>">
<meta property="og:type" content="website">
<meta property="og:title" content="Web of Us">
<meta property="og:description" content="The Amazing TylaSpida #1 — starring Tyla &amp; Christina">
<meta property="og:image" content="https://tylaspida.github.io/web-of-us/images/cover_wide.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tylaspida.github.io/web-of-us/images/cover_wide.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="images/cover_wide.jpg">
<style>
  :root{
    --navy:#0b1026; --navy2:#141a3d; --navy3:#1e2656;
    --pink:#ff3d9a; --pink2:#ff7ac0; --red:#ff2e3f; --ink:#f4f1ff; --muted:#aab0d6;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--navy);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .bangers{font-family:Bangers,Impact,sans-serif;letter-spacing:.04em;font-weight:400}

  /* ---------- Title screen ---------- */
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:24px 22px calc(40px + var(--safe-b));text-align:center;z-index:5;overflow:hidden;
    transition:opacity .45s ease, transform .45s ease}
  #title.hide{opacity:0;transform:scale(1.04);pointer-events:none}
  #title .bg{position:absolute;inset:0;background:url(images/cover_wide.jpg) center 30%/cover no-repeat;filter:saturate(1.1);
    animation:drift 18s ease-in-out infinite alternate}
  #title .shade{position:absolute;inset:0;background:
      radial-gradient(120% 60% at 50% 0%, transparent 0%, rgba(11,16,38,.25) 55%, transparent 100%),
      linear-gradient(180deg, rgba(11,16,38,.15) 0%, rgba(11,16,38,.35) 38%, rgba(11,16,38,.92) 66%, var(--navy) 100%)}
  #title .web{position:absolute;inset:0;opacity:.18;pointer-events:none;
    background:
      repeating-radial-gradient(circle at 100% 0%, transparent 0 34px, rgba(255,255,255,.7) 35px, transparent 36px),
      repeating-conic-gradient(from 180deg at 100% 0%, transparent 0 8deg, rgba(255,255,255,.6) 8deg 8.4deg);
    -webkit-mask:radial-gradient(circle at 100% 0%, #000 0 30%, transparent 55%);mask:radial-gradient(circle at 100% 0%, #000 0 30%, transparent 55%)}
  @keyframes drift{from{transform:scale(1.05) translateY(0)}to{transform:scale(1.12) translateY(-10px)}}
  .content{position:relative;max-width:520px;width:100%}
  .issue{display:inline-block;background:var(--red);color:#fff;padding:5px 12px 3px;border-radius:4px;transform:rotate(-3deg);
    font-size:18px;box-shadow:3px 3px 0 #000;margin-bottom:10px}
  h1{font-size:clamp(64px,19vw,112px);line-height:.9;color:#fff;
    text-shadow:3px 3px 0 var(--red),6px 6px 0 #000, 0 0 28px rgba(255,61,154,.55);transform:rotate(-2deg)}
  h1 .of{color:var(--pink);font-size:.62em;vertical-align:.18em;text-shadow:3px 3px 0 #000}
  .tagline{margin:14px auto 26px;max-width:340px;font-weight:800;font-size:16px;line-height:1.35;color:var(--ink);text-shadow:0 2px 8px #000}
  .tagline b{color:var(--pink2)}
  .cta{position:relative;display:inline-flex;align-items:center;gap:10px;padding:16px 34px 13px;font-size:28px;color:#fff;
    background:linear-gradient(180deg,var(--pink) 0%,#e8207c 100%);border:3px solid #000;border-radius:999px;
    box-shadow:5px 5px 0 #000,0 0 0 4px rgba(255,61,154,.25),0 10px 40px rgba(255,61,154,.5);
    transition:transform .12s ease, box-shadow .12s ease;animation:pulse 2.4s ease-in-out infinite}
  .cta:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
  .cta:hover{filter:brightness(1.08)}
  @keyframes pulse{0%,100%{box-shadow:5px 5px 0 #000,0 0 0 4px rgba(255,61,154,.25),0 10px 40px rgba(255,61,154,.45)}
                   50%{box-shadow:5px 5px 0 #000,0 0 0 10px rgba(255,61,154,.12),0 10px 50px rgba(255,61,154,.7)}}
  .hint{margin-top:18px;font-size:13px;color:var(--muted);font-weight:600}
  .hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .hearts span{position:absolute;bottom:-30px;font-size:18px;opacity:0;animation:float 9s linear infinite}
  @keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.85}100%{transform:translateY(-105vh) rotate(40deg);opacity:0}}

  /* ---------- Reader ---------- */
  /* The reader is a fixed, non-scrolling shell: only the page itself scrolls (natively), so the body never bounces. */
  #reader{position:fixed;inset:0;background:var(--navy);overflow:hidden;overscroll-behavior:none;
    opacity:0;pointer-events:none;transition:opacity .4s ease}
  #reader.show{opacity:1;pointer-events:auto}
  .topbar{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(6px + var(--safe-t)) 10px 10px;background:linear-gradient(180deg,rgba(11,16,38,.94) 55%,rgba(11,16,38,0));
    transition:transform .25s ease, opacity .25s ease;touch-action:none}
  .tb-left,.tb-right{display:flex;gap:8px;align-items:center}
  .brand{font-size:22px;color:#fff;text-shadow:2px 2px 0 var(--red);pointer-events:none}
  .brand span{color:var(--pink)}
  .counter{font-size:20px;padding:4px 12px 2px;border-radius:999px;background:rgba(20,26,61,.85);border:2px solid var(--pink);
    min-width:74px;text-align:center;box-shadow:2px 2px 0 #000;white-space:nowrap}
  .iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(20,26,61,.85);
    border:2px solid rgba(255,255,255,.15);font-size:18px;line-height:1;touch-action:manipulation}
  .iconbtn:hover{border-color:var(--pink)}
  .iconbtn[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 12px rgba(255,61,154,.6)}
  /* stage + book: one page, full width (capped on desktop), full height */
  .stage{position:absolute;inset:0;display:flex;justify-content:center}
  .book{position:relative;width:min(100%,760px);height:100%}
  /* StPageFlip base styles */
  .stf__parent{position:relative;display:block;box-sizing:border-box;transform:translateZ(0);touch-action:pan-y pinch-zoom}
  .stf__parent canvas{position:absolute;width:100%;height:100%;left:0;top:0}
  .stf__block{position:absolute;width:100%;height:100%;box-sizing:border-box;perspective:2000px}
  .stf__item{display:none;position:absolute;transform-style:preserve-3d}
  .stf__outerShadow,.stf__innerShadow,.stf__hardShadow,.stf__hardInnerShadow{position:absolute;left:0;top:0;pointer-events:none}
  .stf__wrapper{position:relative;width:100%;height:100%!important;padding:0!important}
  .page{background:#fbf6ec;overflow:hidden}
  /* each page scrolls vertically inside itself: native momentum, contained overscroll, horizontal left to us */
  .page .scroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;touch-action:pan-y pinch-zoom;background:var(--navy);scrollbar-width:none}
  .page .scroll::-webkit-scrollbar{display:none}
  .page .sheet{position:relative;padding:calc(58px + var(--safe-t)) 0 calc(96px + var(--safe-b));min-height:100%}
  .page img{display:block;width:100%;height:auto;background:#fbf6ec;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;
    -webkit-touch-callout:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  /* paper feel: gutter shading on the spine edge */
  .page .sheet::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(0,0,0,.14) 0%,rgba(0,0,0,0) 4%,rgba(0,0,0,0) 97%,rgba(255,255,255,.08) 100%)}
  .page .pnum{text-align:center;color:var(--muted);font-weight:800;font-size:13px;padding:14px 0 0;letter-spacing:.05em}
  /* end page */
  .page.endpage .sheet{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;
    padding-left:20px;padding-right:20px;background:radial-gradient(120% 70% at 50% 20%,var(--navy3),var(--navy) 70%);color:var(--ink)}
  .page.endpage .sheet::after{display:none}
  .end h2{font-size:clamp(34px,11vw,60px);line-height:1;color:#fff;text-shadow:3px 3px 0 var(--red),5px 5px 0 #000;transform:rotate(-2deg)}
  .end h2 em{font-style:normal;display:block;color:var(--pink);font-size:.6em;text-shadow:3px 3px 0 #000}
  .end p{color:var(--muted);font-weight:700;max-width:260px;font-size:14px}
  .burst{width:min(170px,40vw);aspect-ratio:1;display:grid;place-items:center;font-size:min(66px,16vw);
    background:var(--pink);clip-path:polygon(50% 0,61% 20%,82% 8%,78% 31%,100% 35%,84% 52%,98% 70%,75% 72%,74% 95%,56% 82%,40% 100%,34% 78%,10% 88%,18% 65%,0 52%,17% 38%,6% 16%,30% 20%);
    animation:beat 1.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.07) rotate(3deg)}}
  .cta.small{font-size:22px;padding:12px 24px 9px;animation:none}
  .ghost{font-size:14px;font-weight:800;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  /* bottom nav: big, obvious Back / Next buttons + dots */
  .navbar{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:18px 12px calc(10px + var(--safe-b));background:linear-gradient(0deg,rgba(11,16,38,.95) 55%,rgba(11,16,38,0));
    transition:transform .25s ease, opacity .25s ease;touch-action:none}
  .navbtn{min-width:94px;height:50px;padding:4px 16px 0;border-radius:999px;font-size:22px;color:#fff;touch-action:manipulation;
    background:linear-gradient(180deg,var(--pink) 0%,#e8207c 100%);border:3px solid #000;box-shadow:3px 3px 0 #000;transition:transform .1s, opacity .2s}
  .navbtn.prevbtn{background:rgba(20,26,61,.92);border-color:var(--pink)}
  .navbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  .navbtn:disabled{opacity:.3;pointer-events:none}
  .dots{display:flex;justify-content:center;align-items:center;gap:5px;flex:1;min-width:0}
  .dots button{flex:none;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28);padding:0;transition:all .25s ease}
  .dots button:focus{outline:none}
  .dots button:focus-visible{outline:2px solid var(--pink2);outline-offset:3px}
  .dots button.on{width:16px;border-radius:5px;background:var(--pink);box-shadow:0 0 10px var(--pink)}
  .dots button.heart{background:none;width:auto;height:auto;font-size:10px;line-height:8px;opacity:.5}
  .dots button.heart.on{opacity:1;box-shadow:none;transform:scale(1.3)}
  #reader.immersive .topbar{transform:translateY(-100%);opacity:0;pointer-events:none}
  #reader.immersive .navbar{transform:translateY(100%);opacity:0;pointer-events:none}
  /* edge-tap flash so a tap on the left/right edge visibly registers */
  .edgeflash{position:absolute;top:0;bottom:0;width:28%;z-index:3;pointer-events:none;opacity:0;transition:opacity .35s ease}
  .edgeflash.l{left:0;background:linear-gradient(90deg,rgba(255,61,154,.28),transparent)}
  .edgeflash.r{right:0;background:linear-gradient(270deg,rgba(255,61,154,.28),transparent)}
  .edgeflash.on{opacity:1;transition:none}
  .swipehint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;text-align:center;
    background:rgba(11,16,38,.86);border:2px solid var(--pink);border-radius:16px;padding:12px 16px;font-weight:800;font-size:14px;line-height:1.4;
    opacity:0;transition:opacity .4s;max-width:80%}
  .swipehint.on{opacity:1}
  /* desktop side arrows, beside the page */
  .zone{position:absolute;top:50%;transform:translateY(-50%);z-index:3;display:none;width:56px;height:56px;border-radius:50%;
    place-items:center;font-size:28px;background:rgba(20,26,61,.85);border:2px solid var(--pink);box-shadow:3px 3px 0 #000;opacity:.7;transition:opacity .2s}
  .zone:hover{opacity:1}
  .zone.prev{left:max(12px,calc(50% - 380px - 76px))}
  .zone.next{right:max(12px,calc(50% - 380px - 76px))}
  .zone:disabled{visibility:hidden}
  @media (hover:hover) and (pointer:fine) and (min-width:900px){ .zone{display:grid} }

  @media (prefers-reduced-motion:reduce){#title .bg,.cta,.burst,.hearts span{animation:none!important}}
</style>
</head>
<body>

<!-- Title screen -->
<section id="title" aria-label="Title screen">
  <div class="bg" role="img" aria-label="Cover art: The Amazing TylaSpida"></div>
  <div class="shade"></div>
  <div class="web"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <div class="content">
    <div class="issue bangers">Issue #1</div>
    <h1 class="bangers">Web <span class="of">of</span> Us</h1>
    <p class="tagline">The Amazing TylaSpida #1 — starring <b>Tyla</b> &amp; <b>Christina</b></p>
    <button class="cta bangers" id="start">Start reading <span aria-hidden="true">🕸️</span></button>
    <p class="hint">Scroll down to read · swipe or tap the edges to turn pages</p>
  </div>
</section>

<!-- Reader -->
<section id="reader" aria-label="Comic reader" aria-hidden="true">
  <div class="stage" id="stage"></div>
  <div class="edgeflash l" id="flashL"></div>
  <div class="edgeflash r" id="flashR"></div>
  <div class="swipehint" id="swipehint">Scroll down to read ↓<br>Swipe ← or tap the right edge for the next page</div>
  <div class="topbar">
    <div class="tb-left">
      <button class="iconbtn" id="home" aria-label="Back to title">⌂</button>
      <button class="iconbtn" id="sound" aria-label="Page-turn sound" aria-pressed="false" title="Page-turn sound">🔇</button>
    </div>
    <div class="brand bangers">Web <span>of</span> Us</div>
    <div class="counter bangers" id="counter" aria-live="polite">1 / 10</div>
  </div>
  <button class="zone prev" id="zprev" aria-label="Previous page">‹</button>
  <button class="zone next" id="znext" aria-label="Next page">›</button>
  <div class="navbar">
    <button class="navbtn prevbtn bangers" id="bprev" aria-label="Previous page">‹ Back</button>
    <nav class="dots" id="dots" aria-label="Pages"></nav>
    <button class="navbtn nextbtn bangers" id="bnext" aria-label="Next page">Next ›</button>
  </div>
</section>

<!-- StPageFlip v2.0.7 (MIT) — local copy, see lib/page-flip.LICENSE.txt -->
<script src="lib/page-flip.browser.js"></script>
<script>
(() => {
  const PAGES = [
    {src:'images/01.jpg', label:'Cover', w:1014, h:1440},
    {src:'images/02.jpg', label:'Page 1'},
    {src:'images/03.jpg', label:'Page 2'},
    {src:'images/04.jpg', label:'Page 3'},
    {src:'images/05.jpg', label:'Page 4'},
    {src:'images/06.jpg', label:'Page 5'},
    {src:'images/07.jpg', label:'Page 6'},
    {src:'images/08.jpg', label:'Page 7'},
    {src:'images/09.jpg', label:'Page 8'},
    {src:'images/10.jpg', label:'P.S.'},
  ];
  const N = PAGES.length, TOTAL = N + 1; // + end page
  const $ = id => document.getElementById(id);
  const title=$('title'), reader=$('reader'), stage=$('stage'), dots=$('dots'), counter=$('counter'), swipehint=$('swipehint');
  let idx = 0, hinted = false;

  // floating hearts on title
  const hearts=$('hearts'), glyphs=['❤️','💗','🕷️','💖'];
  for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=glyphs[i%glyphs.length];
    s.style.left=(Math.random()*100)+'%';s.style.animationDelay=(Math.random()*9)+'s';s.style.fontSize=(12+Math.random()*14)+'px';hearts.appendChild(s);}

  // ---- build pages: each page is its own native vertical scroller ----
  const els = PAGES.map((p,i)=>{
    const d=document.createElement('div'); d.className='page'+(i===0?' cover':''); d.dataset.i=i;
    d.innerHTML=`<div class="scroll"><div class="sheet"><img src="${p.src}" width="${p.w||640}" height="${p.h||1440}" alt="${p.label} of Web of Us" draggable="false" decoding="async" ${i>2?'fetchpriority="low"':''}>`+
      `<div class="pnum">${i===0?'':p.label} ${i<N-1?'· swipe for more →':''}</div></div></div>`;
    return d;
  });
  const endEl=document.createElement('div'); endEl.className='page endpage end'; endEl.dataset.i=N;
  endEl.innerHTML=`<div class="scroll"><div class="sheet"><div class="burst" aria-hidden="true">❤️</div>
    <h2 class="bangers">The End…<em>for now ❤️</em></h2>
    <p>Thanks for reading Web of Us, starring Tyla &amp; Christina.</p>
    <button class="cta small bangers" id="again">Read again ↺</button>
    <button class="ghost" id="totitle">Back to title</button></div></div>`;
  els.push(endEl);
  const scrollerOf = i => els[i] && els[i].querySelector('.scroll');

  // ---- PageFlip: used purely as the page-curl animator. Its own mouse/touch handling is OFF
  // (useMouseEvents:false) so it can never fight native scrolling or snap a half-dragged page back;
  // our gesture code below decides when to turn and then plays a full curl. ----
  let pf=null, bookEl=null, size='';
  function build(start){
    if(pf){ try{pf.destroy();}catch(e){} }
    els.forEach(e=>e.remove());
    bookEl=document.createElement('div'); bookEl.className='book'; stage.appendChild(bookEl);
    const w=Math.round(bookEl.clientWidth), h=Math.round(bookEl.clientHeight); size=w+'x'+h;
    els.forEach(e=>bookEl.appendChild(e));
    pf = new St.PageFlip(bookEl, {
      width:w, height:h, size:'stretch', minWidth:w, maxWidth:w, minHeight:h, maxHeight:h,
      autoSize:false, usePortrait:true, showCover:false, startPage:start||0,
      drawShadow:true, maxShadowOpacity:0.6, flippingTime:650,
      useMouseEvents:false, showPageCorners:false, disableFlipByClick:false, mobileScrollSupport:true
    });
    pf.loadFromHTML(els);
    pf.on('flip', onFlipped);
    pf.on('changeState', e=>{ if(e.data==='flipping') swish(1); if(e.data==='read') settle(); });
    window.webOfUs.pf=pf;
  }

  for(let i=0;i<TOTAL;i++){
    const b=document.createElement('button');
    if(i===N){b.className='heart';b.textContent='❤';b.setAttribute('aria-label','The End');}
    else b.setAttribute('aria-label',PAGES[i].label);
    b.addEventListener('click',()=>go(i));
    dots.appendChild(b);
  }

  function refresh(){
    idx=pf.getCurrentPageIndex();
    counter.textContent = idx>=N ? '❤' : `${idx+1} / ${N}`;
    [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===idx));
    $('zprev').disabled=$('bprev').disabled=idx===0;
    $('znext').disabled=$('bnext').disabled=idx>=TOTAL-1;
    if(reader.classList.contains('show')) history.replaceState(null,'', idx ? '#p'+(idx+1) : '#read');
  }

  // ---- turning: one turn at a time, at most one queued (fast double-swipes go two pages, never "bounce") ----
  let busy=false, queued=0, busyTimer=0;
  function turn(dir){
    if(!pf) return;
    if(busy){ queued=dir; return; }
    const cur=pf.getCurrentPageIndex(), target=cur+dir;
    if(target<0 || target>=TOTAL){ nudge(dir); return; }
    busy=true; clearTimeout(busyTimer); busyTimer=setTimeout(settle,1400); // safety net
    const sc=scrollerOf(target); if(sc) sc.scrollTop=0;      // the new page always opens at its top
    dir>0 ? pf.flipNext('bottom') : pf.flipPrev('bottom');
    hideHint();
  }
  function onFlipped(){ refresh(); }
  function settle(){
    if(!busy) return;
    busy=false; clearTimeout(busyTimer); refresh();
    els.forEach((e,k)=>{ if(k!==idx){ const s=scrollerOf(k); if(s) s.scrollTop=0; } });
    if(queued){ const d=queued; queued=0; turn(d); }
  }
  function go(i){
    i=Math.max(0,Math.min(TOTAL-1,i)); if(busy || i===pf.getCurrentPageIndex()) return;
    if(Math.abs(i-pf.getCurrentPageIndex())===1){ turn(i-pf.getCurrentPageIndex()); return; }
    busy=true; clearTimeout(busyTimer); busyTimer=setTimeout(settle,1400);
    const sc=scrollerOf(i); if(sc) sc.scrollTop=0;
    pf.flip(i,'bottom');
  }
  const next=()=>turn(1), prev=()=>turn(-1);
  // tiny shake when there's nowhere to go
  function nudge(dir){ bookEl && bookEl.animate([{transform:'translateX(0)'},{transform:`translateX(${-dir*14}px)`},{transform:'translateX(0)'}],{duration:260,easing:'ease-out'}); }

  // ---- gestures: native vertical scroll; a clear horizontal swipe turns; edge taps turn ----
  // Direction lock: the first ~12px of movement decide. Vertical → it's a scroll, we never turn.
  // Horizontal → turn once the finger has travelled 40px (or a quick 24px flick) — committed, no snap-back.
  let g=null, lastScroll=0;
  stage.addEventListener('scroll',()=>{ lastScroll=performance.now(); },{capture:true,passive:true});
  const flashL=$('flashL'), flashR=$('flashR');
  function flash(el){ el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),60); }
  stage.addEventListener('pointerdown',e=>{
    if(e.button>0 || e.target.closest('button,a')) { g=null; return; }
    g={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),axis:null,done:false,type:e.pointerType,
       scrolling: performance.now()-lastScroll<180}; // a touch that stops momentum is not a tap
  });
  stage.addEventListener('pointermove',e=>{
    if(!g || e.pointerId!==g.id || g.done) return;
    const dx=e.clientX-g.x, dy=e.clientY-g.y;
    if(!g.axis && Math.hypot(dx,dy)>12) g.axis = Math.abs(dx) > Math.abs(dy)*1.3 ? 'x' : 'y';
    if(g.axis==='x' && Math.abs(dx)>=70){ g.done=true; turn(dx<0?1:-1); }
  });
  function end(e){
    if(!g || e.pointerId!==g.id) return;
    const G=g; g=null; if(G.done) return;
    const dx=e.clientX-G.x, dy=e.clientY-G.y, dt=performance.now()-G.t;
    if(G.axis==='x'){
      if(Math.abs(dx)>=40 || (Math.abs(dx)>=24 && Math.abs(dx)/dt>0.35)) turn(dx<0?1:-1);
      return;
    }
    if(G.axis===null && Math.hypot(dx,dy)<12 && dt<450 && !G.scrolling){
      const r=stage.getBoundingClientRect(), fx=(e.clientX-r.left)/r.width;
      if(fx>0.72){ flash(flashR); next(); }
      else if(fx<0.28){ flash(flashL); prev(); }
      else if(G.type!=='mouse') reader.classList.toggle('immersive');  // middle tap: hide/show the bars
    }
  }
  stage.addEventListener('pointerup',end);
  stage.addEventListener('pointercancel',()=>{ g=null; }); // browser took over for a native scroll/pinch
  // desktop trackpads: a deliberate horizontal two-finger swipe turns too
  let wheelAcc=0, wheelLock=0;
  stage.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)*1.5) { wheelAcc=0; return; }
    e.preventDefault(); const now=performance.now(); if(now<wheelLock) return;
    wheelAcc+=e.deltaX; if(Math.abs(wheelAcc)>80){ turn(wheelAcc>0?1:-1); wheelAcc=0; wheelLock=now+700; }
  },{passive:false});

  // ---- soft page-turn sound (synthesised with Web Audio, no asset) ----
  let soundOn = localStorage.getItem('wou-sound')==='1', actx=null;
  const sbtn=$('sound');
  function paintSound(){ sbtn.textContent=soundOn?'🔊':'🔇'; sbtn.setAttribute('aria-pressed',soundOn); }
  paintSound();
  sbtn.addEventListener('click',()=>{ soundOn=!soundOn; localStorage.setItem('wou-sound',soundOn?'1':'0'); paintSound(); if(soundOn) swish(0.6); });
  function swish(vol=1){
    if(!soundOn) return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
      const t=actx.currentTime, dur=0.42, len=Math.floor(actx.sampleRate*dur);
      const buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
      let last=0; for(let k=0;k<len;k++){ last=(last+0.06*(Math.random()*2-1))/1.06; d[k]=last*3.2; } // brown-ish noise = papery
      const src=actx.createBufferSource(); src.buffer=buf;
      const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.8;
      bp.frequency.setValueAtTime(700,t); bp.frequency.exponentialRampToValueAtTime(3200,t+dur*0.55); bp.frequency.exponentialRampToValueAtTime(1200,t+dur);
      const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35*vol,t+0.06); g.gain.exponentialRampToValueAtTime(0.18*vol,t+0.25); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      src.connect(bp).connect(g).connect(actx.destination); src.start(t); src.stop(t+dur);
    }catch(e){}
  }

  // rebuild the book only when the reader's size really changes (rotation, desktop window resize)
  let rt=0;
  addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{
    if(!bookEl || !reader.classList.contains('show')) return;
    const w=Math.round(stage.clientWidth>760?760:stage.clientWidth), h=Math.round(stage.clientHeight);
    if(w+'x'+h===size) return;
    if(busy){ rt=setTimeout(()=>dispatchEvent(new Event('resize')),300); return; }
    const keep=pf.getCurrentPageIndex(), st=scrollerOf(keep).scrollTop;
    build(keep); refresh(); scrollerOf(keep).scrollTop=st;
  },150); });

  function hideHint(){ if(!hinted){ hinted=true; swipehint.classList.remove('on'); try{localStorage.setItem('wou-hinted','1');}catch(e){} } }
  function openReader(start=0){
    title.classList.add('hide'); reader.classList.add('show'); reader.setAttribute('aria-hidden','false');
    reader.classList.remove('immersive');
    if(!pf || size!==Math.round(Math.min(stage.clientWidth,760))+'x'+Math.round(stage.clientHeight)) build(start);
    else if(start!==pf.getCurrentPageIndex()) pf.turnToPage(start);
    refresh();
    hinted = hinted || localStorage.getItem('wou-hinted')==='1';
    if(!hinted){ swipehint.classList.add('on'); setTimeout(hideHint,4500); }
  }
  function toTitle(){
    reader.classList.remove('show'); reader.setAttribute('aria-hidden','true'); title.classList.remove('hide');
    history.replaceState(null,'',location.pathname);
  }
  function restart(){ if(busy) return; const s=scrollerOf(0); if(s) s.scrollTop=0; pf.turnToPage(0); refresh(); swish(0.8); }

  $('start').addEventListener('click',()=>openReader(0));
  $('home').addEventListener('click',toTitle);
  reader.addEventListener('click',e=>{
    if(e.target.id==='again') restart();
    else if(e.target.id==='totitle'){ toTitle(); setTimeout(()=>{pf.turnToPage(0);refresh();},450); }
  });
  $('zprev').addEventListener('click',prev); $('znext').addEventListener('click',next);
  $('bprev').addEventListener('click',prev); $('bnext').addEventListener('click',next);

  addEventListener('keydown',e=>{
    if(!reader.classList.contains('show')){ if(e.key==='Enter'||e.key===' '){ if(document.activeElement===document.body){e.preventDefault();openReader(0);} } return; }
    const sc=scrollerOf(pf.getCurrentPageIndex());
    if(e.key==='ArrowRight'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
    else if(e.key==='ArrowDown'){e.preventDefault();sc.scrollBy({top:120,behavior:'smooth'});}
    else if(e.key==='ArrowUp'){e.preventDefault();sc.scrollBy({top:-120,behavior:'smooth'});}
    else if(e.key==='PageDown'||(e.key===' '&&!e.shiftKey)){ // page down; at the bottom, turn the page
      e.preventDefault(); if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-4) next(); else sc.scrollBy({top:sc.clientHeight*0.8,behavior:'smooth'}); }
    else if(e.key==='PageUp'||(e.key===' '&&e.shiftKey)){ e.preventDefault(); if(sc.scrollTop<=2) prev(); else sc.scrollBy({top:-sc.clientHeight*0.8,behavior:'smooth'}); }
    else if(e.key==='Home'){e.preventDefault();go(0);}
    else if(e.key==='End'){e.preventDefault();go(TOTAL-1);}
    else if(e.key==='Escape'){toTitle();}
  });

  // expose for testing / debugging
  window.webOfUs={pf:null,go,next,prev,isBusy:()=>busy,scroller:()=>scrollerOf(pf.getCurrentPageIndex())};

  // deep link: #p3 opens reader on page index 2
  const m=location.hash.match(/^#p(\d+)$/);
  if(m) openReader(Math.max(0,Math.min(TOTAL,+m[1])-1)); else if(location.hash==='#read') openReader(0);
})();
</script>
</body>
</html>
